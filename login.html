<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Davreignne's Debut</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-image: 
            linear-gradient(135deg, rgba(0, 26, 77, 0.7) 0%, rgba(13, 59, 102, 0.8) 100%),
            url('https://raw.githubusercontent.com/haruhiiiiiiiiiiiiiii/Davreignne-s-Debut-Album/main/MOT04452.JPG');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow-x: hidden;
    }

    .content-wrapper {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 60px 20px; /* Equal padding top and bottom */
    }

    /* Animated Sparkles */
    .sparkle {
        position: fixed;
        width: 8px;
        height: 8px;
        background: radial-gradient(circle, #ffffff 0%, rgba(255,255,255,0.3) 70%);
        border-radius: 50%;
        animation: twinkle 2s ease-in-out infinite, float-random 6s ease-in-out infinite;
        box-shadow: 0 0 15px rgba(192, 192, 192, 0.8);
        z-index: 1;
    }

    .sparkle:nth-child(1) { top: 15%; left: 5%; animation-delay: 0s; }
    .sparkle:nth-child(2) { top: 30%; right: 8%; animation-delay: 0.5s; width: 6px; height: 6px; }
    .sparkle:nth-child(3) { bottom: 20%; left: 10%; animation-delay: 1s; width: 7px; height: 7px; }
    .sparkle:nth-child(4) { top: 60%; right: 5%; animation-delay: 0.8s; width: 5px; height: 5px; }
    .sparkle:nth-child(5) { top: 40%; left: 15%; animation-delay: 1.5s; }
    .sparkle:nth-child(6) { bottom: 30%; right: 20%; animation-delay: 0.3s; width: 6px; height: 6px; }

    @keyframes twinkle { 
        0%, 100% { opacity: 0.3; } 
        50% { opacity: 1; } 
    }

    @keyframes float-random { 
        0% { transform: translateY(0px) translateX(0px); } 
        25% { transform: translateY(-15px) translateX(10px); } 
        50% { transform: translateY(-30px) translateX(-10px); } 
        75% { transform: translateY(-15px) translateX(15px); } 
        100% { transform: translateY(0px) translateX(0px); } 
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(-50px) scale(0.9);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .login-container {
        background: linear-gradient(135deg, rgba(0, 26, 77, 0.95) 0%, rgba(13, 59, 102, 0.95) 100%);
        backdrop-filter: blur(20px);
        border-radius: 25px;
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5), 0 0 50px rgba(192, 192, 192, 0.3);
        padding: 50px 40px;
        max-width: 500px;
        width: 100%;
        border: 3px solid rgba(192, 192, 192, 0.4);
        position: relative;
        z-index: 10;
        animation: slideIn 0.8s ease-out;
        margin: auto; /* Centers the container */
    }

    .login-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .login-icon {
        width: 120px;
        height: 120px;
        margin: 0 auto 20px;
        display: block;
        filter: drop-shadow(0 0 20px rgba(192, 192, 192, 0.6));
        border-radius: 50%;
        border: 3px solid #c0c0c0;
        object-fit: cover;
        background: rgba(255, 255, 255, 0.1);
    }

    .login-title {
        color: #e8e8e8;
        font-size: 2.5em;
        font-weight: bold;
        margin-bottom: 10px;
        text-shadow: 0 0 20px rgba(192, 192, 192, 0.5);
    }

    .login-subtitle {
        color: #c0c0c0;
        font-size: 1.1em;
        text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
    }

    .form-group {
        margin-bottom: 25px;
    }

    .form-group label {
        display: block;
        color: #e8e8e8;
        font-weight: 600;
        margin-bottom: 10px;
        font-size: 1em;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .form-group label i {
        margin-right: 8px;
        color: #c0c0c0;
    }

    .form-input {
        width: 100%;
        padding: 15px 20px;
        border: 2px solid rgba(192, 192, 192, 0.3);
        border-radius: 12px;
        font-size: 1em;
        background: rgba(255, 255, 255, 0.95);
        color: #001a4d;
        transition: all 0.3s ease;
        font-weight: 500;
    }

    .form-input:focus {
        outline: none;
        border-color: #c0c0c0;
        box-shadow: 0 0 15px rgba(192, 192, 192, 0.4);
        background: rgba(255, 255, 255, 1);
    }

    .form-input::placeholder {
        color: #999;
    }

    .login-button {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #c0c0c0 0%, #e8e8e8 50%, #c0c0c0 100%);
        color: #001a4d;
        border: none;
        border-radius: 12px;
        font-size: 1.1em;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 5px 20px rgba(192, 192, 192, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .login-button:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 30px rgba(192, 192, 192, 0.6);
    }

    .login-button:active {
        transform: translateY(-1px);
    }

    .login-button i {
        font-size: 1.2em;
    }

    .error-message {
        background: rgba(220, 53, 69, 0.2);
        border: 2px solid rgba(220, 53, 69, 0.5);
        color: #ff6b6b;
        padding: 12px 20px;
        border-radius: 10px;
        margin-bottom: 20px;
        display: none;
        text-align: center;
        font-weight: 500;
    }

    .error-message.show {
        display: block;
        animation: shake 0.5s ease;
    }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        75% { transform: translateX(10px); }
    }

    .info-text {
        text-align: center;
        color: #c0c0c0;
        font-size: 0.9em;
        margin-top: 20px;
        line-height: 1.6;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .info-text i {
        color: #e8e8e8;
        margin: 0 3px;
    }

    /* Footer Container */
    .creator-footer {
        width: 100%;
        background: linear-gradient(135deg, #001f3f, #003366);
        border-top: 2px solid #C0C0C0;
        padding: 20px 0;
        text-align: center;
        flex-shrink: 0; /* Prevents footer from shrinking */
    }

    .creator-footer p {
        color: #C0C0C0;
        font-family: sans-serif;
        font-size: 0.9rem;
        margin: 0;
    }

    .creator-name {
        font-weight: bold;
        color: #ffffff;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    @media (max-width: 768px) {
        .content-wrapper {
            padding: 40px 20px;
        }

        .login-container {
            padding: 40px 30px;
        }

        .login-title {
            font-size: 2em;
        }

        .login-subtitle {
            font-size: 1em;
        }

        .login-icon {
            width: 100px;
            height: 100px;
        }
    }

    @media (max-width: 480px) {
        body {
            background-attachment: scroll;
        }

        .content-wrapper {
            padding: 30px 15px;
        }

        .login-container {
            padding: 30px 20px;
        }

        .login-title {
            font-size: 1.8em;
        }

        .login-icon {
            width: 80px;
            height: 80px;
        }
    }

        /* Add this new class */
.huge-welcome {
    font-size: 3.8em; /* Very Large */
    font-weight: 900; /* Extra Bold */
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 5px;
    
    /* Silver Gradient Text Effect */
    background: linear-gradient(to bottom, #ffffff 0%, #c0c0c0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    
    /* Glow/Shadow */
    filter: drop-shadow(0 5px 15px rgba(192, 192, 192, 0.4));
    
    /* Pop-in Animation */
    animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

/* Adjust the existing .login-title to fit nicely under the huge welcome */
.login-title {
    color: #e8e8e8;
    font-size: 1.8em; /* Slightly smaller to let Welcome shine */
    font-weight: 600;
    margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(192, 192, 192, 0.3);
    text-transform: none; /* Keep natural casing for the name */
}

/* Add the animation keyframes if not already there */
@keyframes popIn {
    0% { opacity: 0; transform: scale(0.5); }
    100% { opacity: 1; transform: scale(1); }
}

/* Mobile Adjustment */
@media (max-width: 480px) {
    .huge-welcome {
        font-size: 2.8em; /* Still big on phone, but fits screen */
    }
}

</style>

</head>
<body>
    <!-- Animated Sparkles -->
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>

    <div class="content-wrapper">
        <div class="login-container">
            <div class="login-header">
    <img src="https://raw.githubusercontent.com/haruhiiiiiiiiiiiiiii/Davreignne-s-Debut-Album/main/klogoo.png" alt="Davreignne's Debut Logo" class="login-icon">
    
    <div class="huge-welcome">WELCOME!</div>

    <h1 class="login-title">Davreignne's Grand Debut</h1>
    
    <p class="login-subtitle">A Night to Remember</p>
</div>


            <div id="errorMessage" class="error-message">
                <i class="fas fa-exclamation-circle"></i> Please fill in all fields
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="guestName">
                        <i class="fas fa-user"></i> Guest Name
                    </label>
                    <input 
                        type="text" 
                        id="guestName" 
                        class="form-input" 
                        placeholder="Enter your full name (e.g., Chaeyoung Son)"
                        required
                        autocomplete="name"
                    >
                </div>

                <div class="form-group">
                    <label for="nickname">
                        <i class="fas fa-tag"></i> Nickname (For Uploads)
                    </label>
                    <input 
                        type="text" 
                        id="nickname" 
                        class="form-input" 
                        placeholder="Enter one word (e.g., Chaeyo)"
                        required
                        autocomplete="off"
                        maxlength="20"
                    >
                </div>

                <button type="submit" class="login-button">
                    <i class="fas fa-sign-in-alt"></i>
                    Enter Gallery
                </button>
            </form>

            <p class="info-text">
                <i class="fas fa-info-circle"></i> Your nickname will be shown when you upload photos and videos
            </p>
        </div>
    </div>

    <footer class="creator-footer">    
        <div class="footer-container">        
            <p>&copy; 2026 Davreignne's Debut. Designed & Developed by <span class="creator-name">Ma. Dannielle Louiesse Valdez</span></p>    
        </div>
    </footer>

    <script>
        // Check if user is already logged in
        const currentUser = localStorage.getItem('currentUser');
        if (currentUser) {
            window.location.href = 'index.html';
        }

        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const guestNameInput = document.getElementById('guestName');
        const nicknameInput = document.getElementById('nickname');

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const guestName = guestNameInput.value.trim();
            const nickname = nicknameInput.value.trim();

            // Validation
            if (!guestName || !nickname) {
                showError('Please fill in all fields');
                return;
            }

            if (guestName.length < 2) {
                showError('Guest name must be at least 2 characters');
                return;
            }

            if (nickname.length < 2) {
                showError('Nickname must be at least 2 characters');
                return;
            }

            if (nickname.includes(' ')) {
                showError('Nickname should be one word (no spaces)');
                return;
            }

            // Store user data
            const userData = {
                guestName: guestName,
                nickname: nickname,
                loginTime: new Date().toISOString()
            };

            localStorage.setItem('currentUser', JSON.stringify(userData));

            // Success - redirect to main page
            window.location.href = 'index.html';
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 3000);
        }

        // Auto-focus on first input
        window.addEventListener('DOMContentLoaded', function() {
            guestNameInput.focus();
        });
    </script>
</body>
</html>
