<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Guest - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #001a4d 0%, #0d3b66 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .admin-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #001a4d;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .info-box {
            background: linear-gradient(135deg, rgba(0, 26, 77, 0.1), rgba(192, 192, 192, 0.1));
            border: 2px solid #c0c0c0;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: center;
        }

        .info-box i {
            font-size: 2em;
            color: #001a4d;
            margin-bottom: 10px;
        }

        .info-box p {
            color: #001a4d;
            font-weight: 600;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #001a4d;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #c0c0c0;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #c0c0c0, #e8e8e8);
            color: #001a4d;
            margin-bottom: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(192, 192, 192, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .success-message {
            background: #d4edda;
            border: 2px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .success-message.show {
            display: block;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .guest-list {
            margin-top: 30px;
            max-height: 300px;
            overflow-y: auto;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 15px;
        }

        .guest-item {
            background: #f8f9fa;
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .guest-info {
            flex: 1;
        }

        .guest-name {
            font-weight: 600;
            color: #001a4d;
        }

        .guest-nickname {
            color: #666;
            font-size: 0.9em;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .badge-pending {
            background: #ffc107;
            color: #000;
        }

        .badge-set {
            background: #28a745;
            color: #fff;
        }

        .no-users {
            text-align: center;
            color: #999;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1>👑 Add Guest Names</h1>
        <p class="subtitle">Add guest full names. They'll set their own nickname on first login.</p>

        <div class="info-box">
            <i class="fas fa-lightbulb"></i>
            <p>✨ Guests choose their own nicknames when they first log in!</p>
        </div>

        <div id="successMessage" class="success-message">
            <i class="fas fa-check-circle"></i> Guest added successfully!
        </div>

        <form id="addGuestForm">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Guest Full Name</label>
                <input type="text" id="guestName" placeholder="e.g., Chaeyoung Son" required>
            </div>

            <button type="submit" class="btn btn-primary" id="addBtn">
                <i class="fas fa-user-plus"></i> Add Guest
            </button>
        </form>

        <button class="btn btn-secondary" onclick="window.location.href='login.html'">
            <i class="fas fa-arrow-left"></i> Back to Login
        </button>

        <div class="guest-list" id="guestList">
            <p style="text-align: center; color: #999;">Loading guest list...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, where } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDPaMpRBwk8a10vX4CUvsolfUyn3gpec5s",
            authDomain: "debut-photo-gallery.firebaseapp.com",
            projectId: "debut-photo-gallery",
            storageBucket: "debut-photo-gallery.firebasestorage.app",
            messagingSenderId: "954052989718",
            appId: "1:954052989718:web:8faaeeaa9aebe726f67637",
            measurementId: "G-WQ0EW238CJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Check admin password
        const password = prompt('🔐 Enter Admin Password:');
        if (password !== '01082008') {
            alert('❌ Access Denied!');
            window.location.href = 'login.html';
        }

        const form = document.getElementById('addGuestForm');
        const successMsg = document.getElementById('successMessage');
        const addBtn = document.getElementById('addBtn');

        // Add guest to database (name only)
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const guestName = document.getElementById('guestName').value.trim();

            if (!guestName) {
                alert('❌ Please enter a guest name');
                return;
            }

            if (guestName.length < 2) {
                alert('❌ Name must be at least 2 characters');
                return;
            }

            addBtn.disabled = true;
            addBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Adding...';

            try {
                // Check if name already exists
                const q = query(collection(db, 'registeredUsers'), where('guestName', '==', guestName));
                const existingUser = await getDocs(q);
                
                if (!existingUser.empty) {
                    alert('❌ This guest name is already registered!');
                    addBtn.disabled = false;
                    addBtn.innerHTML = '<i class="fas fa-user-plus"></i> Add Guest';
                    return;
                }

                // Add to database (no nickname yet)
                await addDoc(collection(db, 'registeredUsers'), {
                    guestName: guestName,
                    nickname: null, // ✅ Guest will set this on first login
                    registeredAt: Date.now(),
                    addedBy: 'admin',
                    nicknameSet: false
                });

                successMsg.classList.add('show');
                setTimeout(() => successMsg.classList.remove('show'), 3000);

                form.reset();
                loadGuestList();

            } catch (error) {
                alert('❌ Error: ' + error.message);
            } finally {
                addBtn.disabled = false;
                addBtn.innerHTML = '<i class="fas fa-user-plus"></i> Add Guest';
            }
        });

        // Load and display guest list
        async function loadGuestList() {
            const listContainer = document.getElementById('guestList');
            listContainer.innerHTML = '<p style="text-align: center; color: #999;">Loading...</p>';

            try {
                const q = query(collection(db, 'registeredUsers'), orderBy('guestName', 'asc'));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    listContainer.innerHTML = '<p class="no-users">No guests registered yet</p>';
                    return;
                }

                listContainer.innerHTML = '<h3 style="margin-bottom: 15px; color: #001a4d;">Registered Guests (' + querySnapshot.size + ')</h3>';

                querySnapshot.forEach((doc) => {
                    const guest = doc.data();
                    const hasNickname = guest.nickname && guest.nickname !== null;
                    
                    const item = document.createElement('div');
                    item.className = 'guest-item';
                    item.innerHTML = `
                        <div class="guest-info">
                            <div class="guest-name">👤 ${guest.guestName}</div>
                            <div class="guest-nickname">
                                ${hasNickname ? `Nickname: "${guest.nickname}"` : '⏳ Nickname not set yet'}
                            </div>
                        </div>
                        <span class="badge ${hasNickname ? 'badge-set' : 'badge-pending'}">
                            ${hasNickname ? '✓ Set' : 'Pending'}
                        </span>
                    `;
                    listContainer.appendChild(item);
                });

            } catch (error) {
                listContainer.innerHTML = '<p style="color: red;">Error loading guests</p>';
                console.error(error);
            }
        }

        // Load guest list on page load
        loadGuestList();
    </script>
</body>
</html>
