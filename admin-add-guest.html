<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Guest - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #001a4d 0%, #0d3b66 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .admin-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #001a4d;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .info-box {
            background: linear-gradient(135deg, rgba(0, 26, 77, 0.1), rgba(192, 192, 192, 0.1));
            border: 2px solid #c0c0c0;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: center;
        }

        .info-box i {
            font-size: 2em;
            color: #001a4d;
            margin-bottom: 10px;
        }

        .info-box p {
            color: #001a4d;
            font-weight: 600;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #001a4d;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #c0c0c0;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #c0c0c0, #e8e8e8);
            color: #001a4d;
            margin-bottom: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(192, 192, 192, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-edit, .btn-logs {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85em;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            margin-left: 5px;
        }

        .btn-edit {
            background: #007bff;
            color: white;
        }

        .btn-edit:hover {
            background: #0056b3;
            transform: scale(1.05);
        }

        .btn-logs {
            background: #17a2b8;
            color: white;
        }

        .btn-logs:hover {
            background: #138496;
            transform: scale(1.05);
        }

        .success-message {
            background: #d4edda;
            border: 2px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .success-message.show {
            display: block;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .guest-list {
            margin-top: 30px;
            max-height: 400px;
            overflow-y: auto;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 15px;
        }

        .guest-item {
            background: #f8f9fa;
            padding: 12px 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .guest-info {
            flex: 1;
            min-width: 200px;
        }

        .guest-name {
            font-weight: 600;
            color: #001a4d;
            margin-bottom: 4px;
        }

        .guest-nickname {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 2px;
        }

        .guest-stats {
            color: #888;
            font-size: 0.85em;
            display: flex;
            gap: 15px;
            margin-top: 4px;
        }

        .guest-stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .guest-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            white-space: nowrap;
        }

        .badge-pending {
            background: #ffc107;
            color: #000;
        }

        .badge-set {
            background: #28a745;
            color: #fff;
        }

        .no-users {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        /* LOGIN HISTORY MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .modal-header h2 {
            color: #001a4d;
            margin: 0;
            font-size: 1.5em;
        }

        .close-modal {
            background: #dc3545;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2em;
            transition: all 0.3s;
        }

        .close-modal:hover {
            background: #c82333;
            transform: rotate(90deg);
        }

        .login-log-item {
            background: #f8f9fa;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #17a2b8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .log-number {
            font-weight: bold;
            color: #001a4d;
            margin-right: 10px;
        }

        .log-time {
            color: #666;
            font-size: 0.9em;
        }

        .log-date {
            color: #17a2b8;
            font-weight: 600;
        }

        .no-logs {
            text-align: center;
            color: #999;
            padding: 30px;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .guest-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .guest-actions {
                width: 100%;
                justify-content: space-between;
            }

            .modal-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1>👑 Add Guest Names</h1>
        <p class="subtitle">Add guest full names. They'll set their own nickname on first login.</p>

        <div class="info-box">
            <i class="fas fa-lightbulb"></i>
            <p>✨ Guests choose their own nicknames when they first log in!</p>
        </div>

        <div id="successMessage" class="success-message">
            <i class="fas fa-check-circle"></i> <span id="successText">Guest added successfully!</span>
        </div>

        <form id="addGuestForm">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Guest Full Name</label>
                <input type="text" id="guestName" placeholder="e.g., Chaeyoung Son" required>
            </div>

            <button type="submit" class="btn btn-primary" id="addBtn">
                <i class="fas fa-user-plus"></i> Add Guest
            </button>
        </form>

        <button class="btn btn-secondary" onclick="window.location.href='login.html'">
            <i class="fas fa-arrow-left"></i> Back to Login
        </button>

        <div class="guest-list" id="guestList">
            <p style="text-align: center; color: #999;">Loading guest list...</p>
        </div>
    </div>

    <!-- LOGIN HISTORY MODAL -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-history"></i> Login History</h2>
                <button class="close-modal" onclick="closeLoginModal()">×</button>
            </div>
            <div id="modalGuestName" style="color: #666; margin-bottom: 15px; font-size: 1.1em;"></div>
            <div id="loginHistoryList"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, where, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDPaMpRBwk8a10vX4CUvsolfUyn3gpec5s",
            authDomain: "debut-photo-gallery.firebaseapp.com",
            projectId: "debut-photo-gallery",
            storageBucket: "debut-photo-gallery.firebasestorage.app",
            messagingSenderId: "954052989718",
            appId: "1:954052989718:web:8faaeeaa9aebe726f67637",
            measurementId: "G-WQ0EW238CJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Check admin password
        const password = prompt('🔐 Enter Admin Password:');
        if (password !== '01082008') {
            alert('❌ Access Denied!');
            window.location.href = 'login.html';
        }

        const form = document.getElementById('addGuestForm');
        const successMsg = document.getElementById('successMessage');
        const successText = document.getElementById('successText');
        const addBtn = document.getElementById('addBtn');

        // Add guest to database
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const guestName = document.getElementById('guestName').value.trim();

            if (!guestName) {
                alert('❌ Please enter a guest name');
                return;
            }

            if (guestName.length < 2) {
                alert('❌ Name must be at least 2 characters');
                return;
            }

            addBtn.disabled = true;
            addBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Adding...';

            try {
                const q = query(collection(db, 'registeredUsers'), where('guestName', '==', guestName));
                const existingUser = await getDocs(q);
                
                if (!existingUser.empty) {
                    alert('❌ This guest name is already registered!');
                    addBtn.disabled = false;
                    addBtn.innerHTML = '<i class="fas fa-user-plus"></i> Add Guest';
                    return;
                }

                await addDoc(collection(db, 'registeredUsers'), {
                    guestName: guestName,
                    nickname: null,
                    registeredAt: Date.now(),
                    addedBy: 'admin',
                    nicknameSet: false,
                    loginHistory: []
                });

                successText.textContent = 'Guest added successfully!';
                successMsg.classList.add('show');
                setTimeout(() => successMsg.classList.remove('show'), 3000);

                form.reset();
                loadGuestList();

            } catch (error) {
                alert('❌ Error: ' + error.message);
            } finally {
                addBtn.disabled = false;
                addBtn.innerHTML = '<i class="fas fa-user-plus"></i> Add Guest';
            }
        });

        // Edit nickname function
        async function editGuestNickname(docId, currentNickname, guestName) {
            const newNickname = prompt(`✏️ Edit nickname for ${guestName}\n\nCurrent: "${currentNickname}"\n\nEnter new nickname (no spaces, min 2 chars):`);

            if (!newNickname) return;

            const trimmedNickname = newNickname.trim().toLowerCase();

            if (trimmedNickname.length < 2) {
                alert('❌ Nickname must be at least 2 characters!');
                return;
            }

            if (trimmedNickname.includes(' ')) {
                alert('❌ Nickname cannot contain spaces!');
                return;
            }

            try {
                const q = query(collection(db, 'registeredUsers'), where('nickname', '==', trimmedNickname));
                const existingNickname = await getDocs(q);
                
                let isTaken = false;
                existingNickname.forEach((doc) => {
                    if (doc.id !== docId) {
                        isTaken = true;
                    }
                });

                if (isTaken) {
                    alert('❌ This nickname is already taken!');
                    return;
                }

                const userRef = doc(db, 'registeredUsers', docId);
                await updateDoc(userRef, {
                    nickname: trimmedNickname,
                    nicknameSet: true
                });

                successText.textContent = `✅ Nickname updated to "${trimmedNickname}"`;
                successMsg.classList.add('show');
                setTimeout(() => successMsg.classList.remove('show'), 3000);

                loadGuestList();

            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        // Show login history modal
        function showLoginHistory(guestName, loginHistory) {
            const modal = document.getElementById('loginModal');
            const modalGuestName = document.getElementById('modalGuestName');
            const historyList = document.getElementById('loginHistoryList');

            modalGuestName.innerHTML = `<strong>👤 ${guestName}</strong> - Total Logins: ${loginHistory.length}`;

            if (!loginHistory || loginHistory.length === 0) {
                historyList.innerHTML = '<div class="no-logs"><i class="fas fa-info-circle"></i> No login history yet</div>';
            } else {
                historyList.innerHTML = '';
                
                const sortedHistory = [...loginHistory].sort((a, b) => b - a);
                
                sortedHistory.forEach((timestamp, index) => {
                    const date = new Date(timestamp);
                    const item = document.createElement('div');
                    item.className = 'login-log-item';
                    item.innerHTML = `
                        <div>
                            <span class="log-number">#${sortedHistory.length - index}</span>
                            <span class="log-date">${date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</span>
                        </div>
                        <div class="log-time">
                            <i class="fas fa-clock"></i> ${date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}
                        </div>
                    `;
                    historyList.appendChild(item);
                });
            }

            modal.classList.add('show');
        }

        // Close modal
        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('show');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('loginModal');
            if (event.target === modal) {
                closeLoginModal();
            }
        }

        window.editGuestNickname = editGuestNickname;
        window.showLoginHistory = showLoginHistory;
        window.closeLoginModal = closeLoginModal;

        // Load guest list
        async function loadGuestList() {
            const listContainer = document.getElementById('guestList');
            listContainer.innerHTML = '<p style="text-align: center; color: #999;">Loading...</p>';

            try {
                const q = query(collection(db, 'registeredUsers'), orderBy('guestName', 'asc'));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    listContainer.innerHTML = '<p class="no-users">No guests registered yet</p>';
                    return;
                }

                listContainer.innerHTML = '<h3 style="margin-bottom: 15px; color: #001a4d;">Registered Guests (' + querySnapshot.size + ')</h3>';

                querySnapshot.forEach((docSnapshot) => {
                    const guest = docSnapshot.data();
                    const docId = docSnapshot.id;
                    const hasNickname = guest.nickname && guest.nickname !== null;
                    const loginHistory = guest.loginHistory || [];
                    const loginCount = loginHistory.length;
                    
                    const item = document.createElement('div');
                    item.className = 'guest-item';
                    item.innerHTML = `
                        <div class="guest-info">
                            <div class="guest-name">👤 ${guest.guestName}</div>
                            <div class="guest-nickname">
                                ${hasNickname ? `Nickname: "${guest.nickname}"` : '⏳ Nickname not set yet'}
                            </div>
                            <div class="guest-stats">
                                <span><i class="fas fa-sign-in-alt"></i> Logins: ${loginCount}</span>
                                <span><i class="fas fa-calendar"></i> Added: ${new Date(guest.registeredAt).toLocaleDateString()}</span>
                            </div>
                        </div>
                        <div class="guest-actions">
                            <span class="badge ${hasNickname ? 'badge-set' : 'badge-pending'}">
                                ${hasNickname ? '✓ Set' : 'Pending'}
                            </span>
                            ${hasNickname ? `<button class="btn-edit" onclick="editGuestNickname('${docId}', '${guest.nickname}', '${guest.guestName}')">
                                <i class="fas fa-edit"></i> Edit
                            </button>` : ''}
                            ${loginCount > 0 ? `<button class="btn-logs" onclick='showLoginHistory(\`${guest.guestName}\`, ${JSON.stringify(loginHistory)})'>
                                <i class="fas fa-history"></i> Logs
                            </button>` : ''}
                        </div>
                    `;
                    listContainer.appendChild(item);
                });

            } catch (error) {
                listContainer.innerHTML = '<p style="color: red;">Error loading guests</p>';
                console.error(error);
            }
        }

        loadGuestList();
    </script>
</body>
</html>
