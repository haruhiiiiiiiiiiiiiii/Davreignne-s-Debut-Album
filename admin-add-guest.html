<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Guest - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #001a4d 0%, #0d3b66 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .admin-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #001a4d;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #001a4d;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #c0c0c0;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #c0c0c0, #e8e8e8);
            color: #001a4d;
            margin-bottom: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(192, 192, 192, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .success-message {
            background: #d4edda;
            border: 2px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .success-message.show {
            display: block;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .guest-list {
            margin-top: 30px;
            max-height: 300px;
            overflow-y: auto;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 15px;
        }

        .guest-item {
            background: #f8f9fa;
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .guest-info {
            flex: 1;
        }

        .guest-name {
            font-weight: 600;
            color: #001a4d;
        }

        .guest-nickname {
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1>👑 Add Guest to List</h1>
        <p class="subtitle">Only registered guests can access the gallery</p>

        <div id="successMessage" class="success-message">
            <i class="fas fa-check-circle"></i> Guest added successfully!
        </div>

        <form id="addGuestForm">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Full Name</label>
                <input type="text" id="guestName" placeholder="e.g., Chaeyoung Son" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-tag"></i> Nickname</label>
                <input type="text" id="nickname" placeholder="e.g., Chaeyo" required maxlength="20">
            </div>

            <button type="submit" class="btn btn-primary" id="addBtn">
                <i class="fas fa-user-plus"></i> Add Guest
            </button>
        </form>

        <button class="btn btn-secondary" onclick="window.location.href='login.html'">
            <i class="fas fa-arrow-left"></i> Back to Login
        </button>

        <div class="guest-list" id="guestList">
            <p style="text-align: center; color: #999;">Loading guest list...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDPaMpRBwk8a10vX4CUvsolfUyn3gpec5s",
            authDomain: "debut-photo-gallery.firebaseapp.com",
            projectId: "debut-photo-gallery",
            storageBucket: "debut-photo-gallery.firebasestorage.app",
            messagingSenderId: "954052989718",
            appId: "1:954052989718:web:8faaeeaa9aebe726f67637",
            measurementId: "G-WQ0EW238CJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Check admin password
        const password = prompt('🔐 Enter Admin Password:');
        if (password !== '01082008') {
            alert('❌ Access Denied!');
            window.location.href = 'login.html';
        }

        const form = document.getElementById('addGuestForm');
        const successMsg = document.getElementById('successMessage');
        const addBtn = document.getElementById('addBtn');

        // Add guest to database
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const guestName = document.getElementById('guestName').value.trim();
            const nickname = document.getElementById('nickname').value.trim();

            if (!guestName || !nickname) {
                alert('❌ Please fill in all fields');
                return;
            }

            if (nickname.includes(' ')) {
                alert('❌ Nickname must be one word (no spaces)');
                return;
            }

            addBtn.disabled = true;
            addBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Adding...';

            try {
                await addDoc(collection(db, 'registeredUsers'), {
                    guestName: guestName,
                    nickname: nickname,
                    registeredAt: Date.now(),
                    addedBy: 'admin'
                });

                successMsg.classList.add('show');
                setTimeout(() => successMsg.classList.remove('show'), 3000);

                form.reset();
                loadGuestList(); // Refresh list

            } catch (error) {
                alert('❌ Error: ' + error.message);
            } finally {
                addBtn.disabled = false;
                addBtn.innerHTML = '<i class="fas fa-user-plus"></i> Add Guest';
            }
        });

        // Load and display guest list
        async function loadGuestList() {
            const listContainer = document.getElementById('guestList');
            listContainer.innerHTML = '<p style="text-align: center; color: #999;">Loading...</p>';

            try {
                const q = query(collection(db, 'registeredUsers'), orderBy('guestName', 'asc'));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    listContainer.innerHTML = '<p style="text-align: center; color: #999;">No guests registered yet</p>';
                    return;
                }

                listContainer.innerHTML = '<h3 style="margin-bottom: 15px; color: #001a4d;">Registered Guests (' + querySnapshot.size + ')</h3>';

                querySnapshot.forEach((doc) => {
                    const guest = doc.data();
                    const item = document.createElement('div');
                    item.className = 'guest-item';
                    item.innerHTML = `
                        <div class="guest-info">
                            <div class="guest-name">👤 ${guest.guestName}</div>
                            <div class="guest-nickname">Nickname: "${guest.nickname}"</div>
                        </div>
                    `;
                    listContainer.appendChild(item);
                });

            } catch (error) {
                listContainer.innerHTML = '<p style="color: red;">Error loading guests</p>';
                console.error(error);
            }
        }

        // Load guest list on page load
        loadGuestList();
    </script>
</body>
</html>
