<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: 
                linear-gradient(135deg, rgba(0, 26, 77, 0.5) 0%, rgba(13, 59, 102, 0.6) 100%),
                url('https://raw.githubusercontent.com/haruhiiiiiiiiiiiiiii/Davreignne-s-Debut-Album/main/MOT04452.JPG');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .sparkle-1 { position: fixed; width: 8px; height: 8px; background: radial-gradient(circle, #ffffff 0%, rgba(255,255,255,0.3) 70%); border-radius: 50%; top: 15%; left: 5%; animation: twinkle 2s ease-in-out infinite, float-random 6s ease-in-out infinite; box-shadow: 0 0 15px rgba(192, 192, 192, 0.8); z-index: 1; }
        .sparkle-2 { position: fixed; width: 6px; height: 6px; background: radial-gradient(circle, #e8e8e8 0%, rgba(192,192,192,0.3) 70%); border-radius: 50%; top: 30%; right: 8%; animation: twinkle 2.5s ease-in-out infinite 0.5s, float-random 7s ease-in-out infinite; box-shadow: 0 0 12px rgba(200, 200, 200, 0.7); z-index: 1; }

        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        @keyframes float-random { 0% { transform: translateY(0px) translateX(0px); } 25% { transform: translateY(-15px) translateX(10px); } 50% { transform: translateY(-30px) translateX(-10px); } 75% { transform: translateY(-15px) translateX(15px); } 100% { transform: translateY(0px) translateX(0px); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }

        .container { 
            max-width: 1400px; 
            margin: 0 auto; 
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 40px rgba(192, 192, 192, 0.2); 
            padding: 40px;
            border: 3px solid;
            border-image: linear-gradient(135deg, #c0c0c0 0%, #e8e8e8 50%, #c0c0c0 100%) 1;
            position: relative;
            animation: slideDown 0.8s ease-out;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 { 
            color: #001a4d; 
            margin-bottom: 15px; 
            font-size: 2.5em;
            background: linear-gradient(135deg, #001a4d 0%, #c0c0c0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle { 
            color: #555; 
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #e8e8e8 0%, #f5f5f5 50%, #e8e8e8 100%);
            color: #001a4d;
            border: 2px solid #c0c0c0;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(192, 192, 192, 0.4);
        }

        .btn-primary {
            background: linear-gradient(135deg, #001a4d 0%, #0d3b66 100%);
            color: white;
            border-color: #001a4d;
        }

        .btn-primary:hover {
            box-shadow: 0 5px 15px rgba(0, 26, 77, 0.5);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #001a4d;
            font-size: 1.2em;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .photo-item {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            background: white;
            cursor: pointer;
        }

        .photo-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .photo-item img, .photo-item video {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .photo-info {
            padding: 15px;
            background: white;
        }

        .photo-uploader {
            font-weight: bold;
            color: #001a4d;
            margin-bottom: 5px;
        }

        .photo-date {
            font-size: 0.85em;
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h2 {
            color: #001a4d;
            margin-bottom: 15px;
        }

        /* Lightbox styles */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }

        .lightbox-content img, .lightbox-content video {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 10px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 40px;
            color: white;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.5);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .lightbox-close:hover {
            background: rgba(0, 0, 0, 0.8);
            transform: rotate(90deg);
        }

        .lightbox-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            text-align: center;
        }

        @media (max-width: 768px) {
            body { background-attachment: scroll; }
            .container { padding: 25px; }
            h1 { font-size: 2em; }
            .photo-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
            .photo-item img, .photo-item video { height: 150px; }
            .button-group { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="sparkle-1"></div>
    <div class="sparkle-2"></div>

    <div class="container">
        <div class="header">
            <h1 id="albumTitle">📸 Photo Gallery</h1>
            <p class="subtitle" id="photoCount">Loading photos...</p>
        </div>

        <div class="button-group">
            <a href="albums.html" class="btn">📚 All Albums</a>
            <a href="#" id="uploadBtn" class="btn btn-primary">📤 Upload Photos</a>
        </div>

        <div id="photoGrid" class="photo-grid"></div>
        <div id="loadingState" class="loading">🔄 Loading photos...</div>
        <div id="emptyState" class="empty-state" style="display: none;">
            <h2>📭 No photos yet</h2>
            <p>Be the first to share your memories!</p>
            <a href="#" id="uploadBtnEmpty" class="btn btn-primary" style="margin-top: 20px; display: inline-block;">📤 Upload Photos</a>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
        <div class="lightbox-close" onclick="closeLightbox()">×</div>
        <div class="lightbox-content" id="lightboxContent"></div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDPaMpRBwk8a10vX4CUvsolfUyn3gpec5s",
            authDomain: "debut-photo-gallery.firebaseapp.com",
            projectId: "debut-photo-gallery",
            storageBucket: "debut-photo-gallery.firebasestorage.app",
            messagingSenderId: "954052989718",
            appId: "1:954052989718:web:8faaeeaa9aebe726f67637",
            measurementId: "G-WQ0EW238CJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const albumsList = {
            1: 'Table 1', 2: 'Table 2', 3: 'Table 3', 4: 'Table 4', 5: 'Table 5',
            6: 'Table 6', 7: 'Table 7', 8: 'Table 8', 9: 'Table 9', 10: 'Table 10',
            11: 'Table 11', 12: 'Table 12', 13: 'Table 13', 14: 'Table 14',
            15: '18 Roses', 16: '18 Candles', 17: '18 Blue Bills', 18: '18 Treasures', 19: '18 Shots'
        };

        // Get album ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const albumId = urlParams.get('album');

        if (!albumId) {
            window.location.href = 'albums.html';
        }

        const albumName = albumsList[albumId] || 'Unknown Album';
        document.getElementById('albumTitle').textContent = `📸 ${albumName}`;
        document.getElementById('uploadBtn').href = `front.html?album=${albumId}`;
        document.getElementById('uploadBtnEmpty').href = `front.html?album=${albumId}`;

        // Load photos
        async function loadPhotos() {
            const photoGrid = document.getElementById('photoGrid');
            const loadingState = document.getElementById('loadingState');
            const emptyState = document.getElementById('emptyState');
            const photoCount = document.getElementById('photoCount');

            try {
                console.log(`🔍 Loading photos from album ${albumId}...`);
                
                const photosRef = collection(db, `albums/${albumId}/photos`);
                const q = query(photosRef, orderBy('timestamp', 'desc'));
                const querySnapshot = await getDocs(q);

                loadingState.style.display = 'none';

                if (querySnapshot.empty) {
                    console.log('📭 No photos found in this album');
                    emptyState.style.display = 'block';
                    photoCount.textContent = 'No photos yet';
                    return;
                }

                let validPhotoCount = 0;
                const photos = [];

                querySnapshot.forEach((doc) => {
                    const photo = doc.data();
                    
                    // ✅ VALIDATE URL - Skip photos with missing or undefined URLs
                    if (!photo.url || photo.url === 'undefined' || photo.url === '') {
                        console.warn(`⚠️ Skipping invalid photo from database: ${photo.name || 'Unknown'}`);
                        return; // Skip this photo
                    }

                    photos.push({
                        id: doc.id,
                        ...photo
                    });
                    validPhotoCount++;
                });

                console.log(`✅ Loaded ${validPhotoCount} valid photos (skipped ${querySnapshot.size - validPhotoCount} broken)`);

                if (validPhotoCount === 0) {
                    emptyState.style.display = 'block';
                    photoCount.textContent = 'No valid photos to display';
                    return;
                }

                photoCount.textContent = `${validPhotoCount} photo${validPhotoCount !== 1 ? 's' : ''}`;

                photos.forEach((photo) => {
                    const photoItem = document.createElement('div');
                    photoItem.className = 'photo-item';
                    photoItem.onclick = () => openLightbox(photo);

                    const isVideo = photo.type && photo.type.startsWith('video');
                    const mediaElement = isVideo 
                        ? `<video src="${photo.url}" controls></video>`
                        : `<img src="${photo.url}" alt="${photo.name}" loading="lazy">`;

                    const date = photo.timestamp 
                        ? new Date(photo.timestamp).toLocaleDateString('en-US', { 
                            month: 'short', 
                            day: 'numeric', 
                            year: 'numeric' 
                          })
                        : 'Unknown date';

                    photoItem.innerHTML = `
                        ${mediaElement}
                        <div class="photo-info">
                            <div class="photo-uploader">📤 ${photo.uploader || 'Anonymous'}</div>
                            <div class="photo-date">📅 ${date}</div>
                        </div>
                    `;

                    photoGrid.appendChild(photoItem);
                });

            } catch (error) {
                console.error('❌ Error loading photos:', error);
                loadingState.innerHTML = `
                    <p style="color: #dc3545;">❌ Error loading photos</p>
                    <p style="font-size: 0.9em; color: #666;">${error.message}</p>
                `;
            }
        }

        // Lightbox functions
        window.openLightbox = function(photo) {
            const lightbox = document.getElementById('lightbox');
            const lightboxContent = document.getElementById('lightboxContent');
            
            const isVideo = photo.type && photo.type.startsWith('video');
            const mediaElement = isVideo 
                ? `<video src="${photo.url}" controls autoplay style="max-width: 100%; max-height: 90vh;"></video>`
                : `<img src="${photo.url}" alt="${photo.name}">`;

            const date = photo.timestamp 
                ? new Date(photo.timestamp).toLocaleDateString('en-US', { 
                    month: 'long', 
                    day: 'numeric', 
                    year: 'numeric' 
                  })
                : 'Unknown date';

            lightboxContent.innerHTML = `
                ${mediaElement}
                <div class="lightbox-info">
                    <div style="font-weight: bold; margin-bottom: 5px;">${photo.name || 'Untitled'}</div>
                    <div>Uploaded by: ${photo.uploader || 'Anonymous'}</div>
                    <div>${date}</div>
                </div>
            `;

            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        };

        window.closeLightbox = function() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
            
            // Stop any playing videos
            const videos = lightbox.querySelectorAll('video');
            videos.forEach(video => {
                video.pause();
                video.currentTime = 0;
            });
        };

        // Close lightbox on background click
        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLightbox();
            }
        });

        // Close lightbox on ESC key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeLightbox();
            }
        });

        // Load photos on page load
        loadPhotos();
    </script>
</body>
</html>
