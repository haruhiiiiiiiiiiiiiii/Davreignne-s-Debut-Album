<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album - Debut Photo Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #fff;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 2px solid #333;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        .back-link {
            display: inline-block;
            margin: 20px 0;
            padding: 10px 20px;
            background: #222;
            color: #fff;
            text-decoration: none;
            border: 1px solid #444;
            transition: all 0.3s;
        }
        .back-link:hover {
            background: #333;
            border-color: #666;
        }
        .upload-section {
            margin: 30px 0;
            padding: 20px;
            background: #111;
            border: 1px solid #333;
        }
        .upload-section h2 {
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        input[type="file"] {
            display: block;
            margin: 10px 0;
            padding: 10px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            width: 100%;
        }
        button {
            padding: 12px 24px;
            background: #fff;
            color: #000;
            border: none;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 1em;
            text-transform: uppercase;
            transition: all 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background: #ddd;
        }
        button:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
        }
        #uploadStatus {
            margin-top: 15px;
            padding: 10px;
            background: #1a1a1a;
            border-left: 3px solid #00ff00;
            min-height: 20px;
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .photo-card {
            background: #111;
            border: 1px solid #333;
            overflow: hidden;
            transition: transform 0.3s;
            cursor: pointer;
        }
        .photo-card:hover {
            transform: scale(1.05);
            border-color: #666;
        }
        .photo-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }
        .photo-info {
            padding: 15px;
        }
        .photo-info p {
            margin: 5px 0;
            font-size: 0.9em;
            color: #aaa;
        }
        .delete-btn {
            background: #ff0000;
            color: #fff;
            padding: 5px 10px;
            font-size: 0.8em;
            margin-top: 10px;
        }
        .delete-btn:hover {
            background: #cc0000;
        }
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #222;
            border: 1px solid #444;
            margin-top: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #00cc00);
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 id="albumTitle">Album</h1>
            <a href="albums.html" class="back-link">← Back to Albums</a>
        </header>

        <div class="upload-section">
            <h2>Upload Photos</h2>
            <input type="file" id="photoInput" accept="image/*" multiple>
            <button onclick="handleUpload()" id="uploadBtn">Upload Photos</button>
            <div id="uploadStatus"></div>
            <div class="progress-bar" id="progressBar" style="display:none;">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div id="photoGrid" class="photo-grid">
            <div class="loading">Loading photos...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, where, updateDoc, increment } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDSUNht7KCuf-R5uCE8qPF12IWjux4IVJI",
            authDomain: "debut-photo-gallery.firebaseapp.com",
            projectId: "debut-photo-gallery",
            storageBucket: "debut-photo-gallery.firebasestorage.app",
            messagingSenderId: "846149498552",
            appId: "1:846149498552:web:b05cfc3ad33cca60d50b53"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        window.db = db;
        window.storage = storage;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.deleteDoc = deleteDoc;
        window.doc = doc;
        window.query = query;
        window.where = where;
        window.updateDoc = updateDoc;
        window.increment = increment;
        window.ref = ref;
        window.uploadBytesResumable = uploadBytesResumable;
        window.getDownloadURL = getDownloadURL;
        window.deleteObject = deleteObject;

        const urlParams = new URLSearchParams(window.location.search);
        const albumName = urlParams.get('name');
        
        if (albumName) {
            document.getElementById('albumTitle').textContent = albumName;
            loadPhotos(albumName);
        }

        async function loadPhotos(albumName) {
            try {
                const q = query(collection(db, 'photos'), where('album', '==', albumName));
                const querySnapshot = await getDocs(q);
                
                const photoGrid = document.getElementById('photoGrid');
                photoGrid.innerHTML = '';

                if (querySnapshot.empty) {
                    photoGrid.innerHTML = '<div class="loading">No photos yet. Upload some!</div>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const photo = doc.data();
                    const photoCard = createPhotoCard(photo, doc.id);
                    photoGrid.appendChild(photoCard);
                });
            } catch (error) {
                console.error('Error loading photos:', error);
                document.getElementById('photoGrid').innerHTML = 
                    '<div class="loading">Error loading photos</div>';
            }
        }

        function createPhotoCard(photo, photoId) {
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.innerHTML = `
                <img src="${photo.url}" alt="${photo.name}" onclick="window.open('${photo.url}', '_blank')">
                <div class="photo-info">
                    <p><strong>${photo.name}</strong></p>
                    <p>${new Date(photo.uploadedAt).toLocaleDateString()}</p>
                    <button class="delete-btn" onclick="deletePhoto('${photoId}', '${photo.storagePath}')">Delete</button>
                </div>
            `;
            return card;
        }

        window.deletePhoto = async function(photoId, storagePath) {
            if (!confirm('Delete this photo?')) return;

            try {
                await deleteDoc(doc(db, 'photos', photoId));
                const storageRef = ref(storage, storagePath);
                await deleteObject(storageRef);
                
                const albumsQuery = query(collection(db, 'albums'), where('name', '==', albumName));
                const albumSnapshot = await getDocs(albumsQuery);
                if (!albumSnapshot.empty) {
                    const albumDoc = albumSnapshot.docs[0];
                    await updateDoc(doc(db, 'albums', albumDoc.id), {
                        photoCount: increment(-1)
                    });
                }
                
                loadPhotos(albumName);
                alert('Photo deleted!');
            } catch (error) {
                console.error('Error deleting photo:', error);
                alert('Error deleting photo');
            }
        }

        window.handleUpload = async function() {
            const fileInput = document.getElementById('photoInput');
            const files = fileInput.files;
            
            if (files.length === 0) {
                alert('Please select photos to upload');
                return;
            }

            const uploadBtn = document.getElementById('uploadBtn');
            const uploadStatus = document.getElementById('uploadStatus');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            
            uploadBtn.disabled = true;
            progressBar.style.display = 'block';
            uploadStatus.textContent = 'Preparing upload...';

            try {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    uploadStatus.textContent = `Processing ${i + 1}/${files.length}: ${file.name}`;
                    
                    // Compress image
                    const compressedFile = await compressImage(file);
                    const storagePath = `photos/${albumName}/${Date.now()}_${compressedFile.name}`;
                    const storageRef = ref(storage, storagePath);
                    const uploadTask = uploadBytesResumable(storageRef, compressedFile);

                    await new Promise((resolve, reject) => {
                        uploadTask.on('state_changed',
                            (snapshot) => {
                                const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                                progressFill.style.width = progress + '%';
                                uploadStatus.textContent = 
                                    `Uploading ${i + 1}/${files.length}: ${Math.round(progress)}%`;
                            },
                            (error) => reject(error),
                            async () => {
                                try {
                                    const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);
                                    
                                    await addDoc(collection(db, 'photos'), {
                                        name: file.name,
                                        url: downloadURL,
                                        storagePath: storagePath,
                                        album: albumName,
                                        uploadedAt: Date.now()
                                    });

                                    const albumsQuery = query(collection(db, 'albums'), where('name', '==', albumName));
                                    const albumSnapshot = await getDocs(albumsQuery);
                                    if (!albumSnapshot.empty) {
                                        const albumDoc = albumSnapshot.docs[0];
                                        await updateDoc(doc(db, 'albums', albumDoc.id), {
                                            photoCount: increment(1)
                                        });
                                    }
                                    
                                    resolve();
                                } catch (error) {
                                    reject(error);
                                }
                            }
                        );
                    });
                }

                uploadStatus.textContent = '✓ All photos uploaded successfully!';
                progressFill.style.width = '100%';
                fileInput.value = '';
                loadPhotos(albumName);
                
                setTimeout(() => {
                    progressBar.style.display = 'none';
                    progressFill.style.width = '0%';
                    uploadStatus.textContent = '';
                }, 3000);

            } catch (error) {
                console.error('Upload error:', error);
                uploadStatus.textContent = '✗ Upload failed: ' + error.message;
            } finally {
                uploadBtn.disabled = false;
            }
        }

        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        
                        // Resize if too large
                        const maxDimension = 1920;
                        if (width > maxDimension || height > maxDimension) {
                            if (width > height) {
                                height = (height / width) * maxDimension;
                                width = maxDimension;
                            } else {
                                width = (width / height) * maxDimension;
                                height = maxDimension;
                            }
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        canvas.toBlob((blob) => {
                            resolve(new File([blob], file.name, {
                                type: 'image/jpeg',
                                lastModified: Date.now()
                            }));
                        }, 'image/jpeg', 0.85);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
