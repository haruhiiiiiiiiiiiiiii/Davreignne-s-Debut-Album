<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Photo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: 
                linear-gradient(135deg, rgba(0, 26, 77, 0.5) 0%, rgba(13, 59, 102, 0.6) 100%),
                url('https://raw.githubusercontent.com/haruhiiiiiiiiiiiiiii/Davreignne-s-Debut-Album/main/MOT04452.JPG');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
        }

        .container { 
            max-width: 600px; 
            margin: 50px auto; 
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); 
            padding: 40px;
        }

        h1 { 
            text-align: center; 
            color: #001a4d; 
            margin-bottom: 30px; 
            font-size: 2.5em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #001a4d;
            font-size: 1.1em;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 15px;
            border: 2px solid #c0c0c0;
            border-radius: 12px;
            font-size: 1em;
            font-family: inherit;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #001a4d;
        }

        .file-info {
            margin-top: 10px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 8px;
            font-size: 0.9em;
            color: #555;
        }

        .upload-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #001a4d 0%, #0d3b66 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 26, 77, 0.4);
        }

        .upload-btn:disabled {
            background: #999;
            cursor: not-allowed;
            transform: none;
        }

        .progress-container {
            margin-top: 20px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #00cc00);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
            font-size: 0.9em;
        }

        .upload-status {
            text-align: center;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
            color: #333;
            font-weight: 500;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #001a4d;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Upload Photo</h1>

        <form id="uploadForm">
            <div class="form-group">
                <label for="albumSelect">Select Album:</label>
                <select id="albumSelect" required>
                    <option value="">-- Choose Album --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="uploaderName">Your Name:</label>
                <input type="text" id="uploaderName" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="photoFile">Choose Photo/Video (Max 5MB each):</label>
                <input type="file" id="photoFile" accept="image/*,video/*" multiple required>
                <div class="file-info" id="fileInfo" style="display: none;"></div>
            </div>

            <button type="submit" class="upload-btn" id="uploadBtn">Upload</button>
        </form>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">0%</div>
            </div>
            <div class="upload-status" id="uploadStatus">Preparing upload...</div>
        </div>

        <a href="albums.html" class="back-link">← Back to Albums</a>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDPaMpRBwk8a10vX4CUvsolfUyn3gpec5s",
            authDomain: "debut-photo-gallery.firebaseapp.com",
            projectId: "debut-photo-gallery",
            storageBucket: "debut-photo-gallery.firebasestorage.app",
            messagingSenderId: "954052989718",
            appId: "1:954052989718:web:8faaeeaa9aebe726f67637",
            measurementId: "G-WQ0EW238CJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const albumsList = [
            { id: 1, name: 'Table 1' }, { id: 2, name: 'Table 2' }, { id: 3, name: 'Table 3' },
            { id: 4, name: 'Table 4' }, { id: 5, name: 'Table 5' }, { id: 6, name: 'Table 6' },
            { id: 7, name: 'Table 7' }, { id: 8, name: 'Table 8' }, { id: 9, name: 'Table 9' },
            { id: 10, name: 'Table 10' }, { id: 11, name: 'Table 11' }, { id: 12, name: 'Table 12' },
            { id: 13, name: 'Table 13' }, { id: 14, name: 'Table 14' }, { id: 15, name: '18 Roses' },
            { id: 16, name: '18 Candles' }, { id: 17, name: '18 Blue Bills' }, 
            { id: 18, name: '18 Treasures' }, { id: 19, name: '18 Shots' }
        ];

        // Load albums into dropdown
        const albumSelect = document.getElementById('albumSelect');
        albumsList.forEach(album => {
            const option = document.createElement('option');
            option.value = album.id;
            option.textContent = album.name;
            albumSelect.appendChild(option);
        });

        // Pre-select album from URL
        const urlParams = new URLSearchParams(window.location.search);
        const preselectedAlbum = urlParams.get('album');
        if (preselectedAlbum) {
            albumSelect.value = preselectedAlbum;
        }

        // Show file info when files are selected
        document.getElementById('photoFile').addEventListener('change', (e) => {
            const files = e.target.files;
            const fileInfo = document.getElementById('fileInfo');
            
            if (files.length > 0) {
                const totalSize = Array.from(files).reduce((sum, file) => sum + file.size, 0);
                const totalSizeMB = (totalSize / (1024 * 1024)).toFixed(2);
                
                fileInfo.style.display = 'block';
                fileInfo.textContent = `${files.length} file(s) selected • Total: ${totalSizeMB} MB`;
                
                // Check if any file exceeds 5MB
                const oversized = Array.from(files).filter(f => f.size > 5 * 1024 * 1024);
                if (oversized.length > 0) {
                    fileInfo.textContent += ` ⚠️ ${oversized.length} file(s) exceed 5MB limit`;
                    fileInfo.style.color = 'red';
                } else {
                    fileInfo.style.color = '#555';
                }
            } else {
                fileInfo.style.display = 'none';
            }
        });

        // Compress image before upload
        function compressFile(file) {
            return new Promise((resolve) => {
                // If video, don't compress
                if (file.type.startsWith('video/')) {
                    resolve(file);
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        
                        // Resize if too large
                        const maxDimension = 1920;
                        if (width > maxDimension || height > maxDimension) {
                            if (width > height) {
                                height = (height / width) * maxDimension;
                                width = maxDimension;
                            } else {
                                width = (width / height) * maxDimension;
                                height = maxDimension;
                            }
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        canvas.toBlob((blob) => {
                            resolve(new File([blob], file.name, {
                                type: 'image/jpeg',
                                lastModified: Date.now()
                            }));
                        }, 'image/jpeg', 0.85);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // Upload single file
        async function uploadSingleFile(file, albumId, uploaderName, fileIndex, totalFiles) {
            return new Promise(async (resolve, reject) => {
                try {
                    const compressedFile = await compressFile(file);
                    
                    const storageRef = ref(storage, `albums/${albumId}/${Date.now()}_${file.name}`);
                    const uploadTask = uploadBytesResumable(storageRef, compressedFile);

                    uploadTask.on('state_changed',
                        (snapshot) => {
                            const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                            const progressFill = document.getElementById('progressFill');
                            const uploadStatus = document.getElementById('uploadStatus');
                            
                            progressFill.style.width = progress + '%';
                            progressFill.textContent = Math.round(progress) + '%';
                            uploadStatus.textContent = `Uploading file ${fileIndex + 1} of ${totalFiles}: ${Math.round(progress)}%`;
                        },
                        (error) => {
                            reject(error);
                        },
                        async () => {
                            try {
                                const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);
                                
                                const uploadStatus = document.getElementById('uploadStatus');
                                uploadStatus.textContent = 'Saving...';

                                await addDoc(collection(db, `albums/${albumId}/photos`), {
                                    name: file.name,
                                    dataUrl: downloadURL,
                                    uploader: uploaderName,
                                    size: compressedFile.size,
                                    timestamp: Date.now()
                                });

                                resolve();
                            } catch (error) {
                                reject(error);
                            }
                        }
                    );
                } catch (error) {
                    reject(error);
                }
            });
        }

        // Handle form submission
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const albumId = parseInt(albumSelect.value);
            const uploaderName = document.getElementById('uploaderName').value.trim();
            const fileInput = document.getElementById('photoFile');
            const files = Array.from(fileInput.files);

            if (!albumId || !uploaderName || files.length === 0) {
                alert('Please fill all fields');
                return;
            }

            // Check if any file exceeds 5MB
            const oversizedFiles = files.filter(f => f.size > 5 * 1024 * 1024);
            if (oversizedFiles.length > 0) {
                alert(`${oversizedFiles.length} file(s) exceed 5MB limit. Please remove them and try again.`);
                return;
            }

            const uploadBtn = document.getElementById('uploadBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressFill = document.getElementById('progressFill');
            const uploadStatus = document.getElementById('uploadStatus');

            uploadBtn.disabled = true;
            progressContainer.style.display = 'block';
            uploadStatus.textContent = 'Starting upload...';

            try {
                // Upload files one by one
                for (let i = 0; i < files.length; i++) {
                    await uploadSingleFile(files[i], albumId, uploaderName, i, files.length);
                }

                // All done!
                uploadStatus.textContent = 'Done!';
                progressFill.style.width = '100%';
                progressFill.textContent = '100%';
                progressFill.style.background = 'linear-gradient(90deg, #00ff00, #00cc00)';

                setTimeout(() => {
                    window.location.href = `album.html?album=${albumId}`;
                }, 1500);

            } catch (error) {
                console.error('Upload error:', error);
                uploadStatus.textContent = '❌ Upload failed: ' + error.message;
                uploadBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
